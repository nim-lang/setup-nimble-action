name: build

on:
  push:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - '*.md'

jobs:
  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}

  test-on-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macOS-latest
        version:
          - 0.16.2
          - 0.16.3
          - 0.16.4
          - latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nimble-version: ${{ matrix.version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Nimble version
        run: nimble -v

  test-multi-versions:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        version:
          - 0.16.2
          - 0.16.3          
          - latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nimble-version: ${{ matrix.version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Nimble version
        run: nimble -v

  test-parent-directory:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nimble-version: 0.16.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nimble-install-directory: ${{ runner.temp }}

      - name: Print Nimble version
        run: nimble -v

  # A commit-ish pin builds nimble from source. Every source build costs minutes,
  # so this builds one fixed SHA per OS and nothing more: the other spellings
  # (short SHA, branch) resolve to a SHA before anything is built, and that
  # resolution is covered by test-resolver. Building `master` here would make
  # this repo's CI fail whenever nimble's master doesn't compile -- a signal
  # about nimble, not about this action.
  test-commit-pin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nimble-version: a1b471d13d173897942f99d013f4efb79913bdf2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Nimble version
        run: nimble -v

  # A source build must honour parent-nimble-install-directory the same way a
  # release download does.
  test-commit-pin-parent-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nimble-version: a1b471d13d173897942f99d013f4efb79913bdf2
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nimble-install-directory: ${{ runner.temp }}

      - name: Print Nimble version
        run: nimble -v

  # An unresolvable input must fail with our own message, not a tar or unzip error.
  test-invalid-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: install
        continue-on-error: true
        uses: ./
        with:
          nimble-version: definitely-not-a-real-ref
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert the action failed
        run: |
          if [[ "${{ steps.install.outcome }}" != "failure" ]]; then
            echo "Expected an invalid nimble-version to fail the action"
            exit 1
          fi

  # Resolution is pure, so it can be exercised directly without installing.
  test-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve known inputs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          assert_resolves() {
            local input=$1 expected=$2 actual
            actual=$(./resolve_nimble_version.sh --nimble-version "$input" --repo-token "$TOKEN" 2>/dev/null |
              tr '\n' ' ' | sed -E 's/ +$//')
            if [[ "$actual" != "$expected" ]]; then
              echo "resolve('$input')"
              echo "  expected: $expected"
              echo "  actual:   $actual"
              exit 1
            fi
            echo "ok: resolve('$input') -> $actual"
          }

          assert_fails() {
            local input=$1
            if ./resolve_nimble_version.sh --nimble-version "$input" --repo-token "$TOKEN" > /dev/null 2>&1; then
              echo "resolve('$input') should have failed"
              exit 1
            fi
            echo "ok: resolve('$input') failed as expected"
          }

          # A wildcard means "newest matching", so asserting an exact result
          # would fail the day nimble tags 0.16.5. Assert the shape instead.
          assert_matches() {
            local input=$1 pattern=$2 actual
            actual=$(./resolve_nimble_version.sh --nimble-version "$input" --repo-token "$TOKEN" 2>/dev/null |
              tr '\n' ' ' | sed -E 's/ +$//')
            if [[ ! "$actual" =~ $pattern ]]; then
              echo "resolve('$input')"
              echo "  expected to match: $pattern"
              echo "  actual:            $actual"
              exit 1
            fi
            echo "ok: resolve('$input') -> $actual"
          }

          assert_resolves "0.16.4" "kind=release version=0.16.4 sha="
          assert_resolves "v0.16.4" "kind=release version=0.16.4 sha="
          assert_matches "0.16.x" '^kind=release version=0\.16\.[0-9]+ sha=$'
          assert_resolves "nightly" "kind=release version=latest sha="
          assert_resolves "a1b471d" "kind=source version=a1b471d sha=a1b471d13d173897942f99d013f4efb79913bdf2"
          assert_resolves "a1b471d13d173897942f99d013f4efb79913bdf2" "kind=source version=a1b471d13d173897942f99d013f4efb79913bdf2 sha=a1b471d13d173897942f99d013f4efb79913bdf2"
          # A branch resolves to whatever it points at today, so assert the shape.
          assert_matches "master" '^kind=source version=master sha=[0-9a-f]{40}$'

          assert_fails "9.9.9"
          assert_fails "definitely-not-a-real-ref"
          # A ref must not be able to redirect the API call to another repo.
          assert_fails "../../../repos/torvalds/linux/commits/master"

  # The installed nimble must match the runner it is on. `latest` publishes a
  # native asset for every arch here
  test-native-arch:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # x64
          - ubuntu-24.04-arm   # arm64
          - macOS-latest       # arm64 (Apple Silicon)
          - macos-15-intel     # x64
          - windows-latest     # x64
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nimble-version: latest
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert nimble matches the host architecture
        shell: bash
        run: |
          set -eu
          bin=$(command -v nimble)
          desc=$(file -b "$bin")
          host=$(uname -m)
          echo "host=$host  binary=$desc"

          case "$host" in
            arm64 | aarch64) expect='arm64|aarch64' ;;
            # `file` writes x86-64 on Linux and x86_64 on macOS.
            x86_64)          expect='x86-64|x86_64|PE32\+' ;;
            *)               echo "unhandled host arch $host"; exit 1 ;;
          esac

          if ! printf '%s' "$desc" | grep -qE "$expect"; then
            echo "Expected a $host binary, got: $desc"
            exit 1
          fi
          echo "ok: native $host binary"

  # macOS only started publishing macosx_aarch64 at 0.22.2, so an older pin on
  # Apple Silicon must fall back to x64 -- and must say so loudly.
  test-arch-fallback:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - name: Older nimble on arm64 falls back to x64 with a warning
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -eu
          out=$(./install_nimble.sh \
            --kind release --nimble-version 0.16.4 --arch ARM64 \
            --parent-nimble-install-directory "$RUNNER_TEMP" \
            --nimble-install-directory fallback_check \
            --os macOS 2>&1)
          echo "$out"

          if ! printf '%s' "$out" | grep -q '::warning title=Nimble architecture fallback::'; then
            echo "Expected a ::warning:: annotation for the x64 fallback"
            exit 1
          fi

          bin="$RUNNER_TEMP/fallback_check/bin/nimble"
          if ! file -b "$bin" | grep -q 'x86_64'; then
            echo "Expected the fallback binary to be x86_64, got: $(file -b "$bin")"
            exit 1
          fi
          "$bin" -v > /dev/null
          echo "ok: warned, installed x64, and it runs"

