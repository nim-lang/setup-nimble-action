name: release
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    types:
      - labeled

jobs:
  release:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Bump version on merging Pull Requests with specific labels.
      # (bump:major,bump:minor,bump:patch)
      - id: bumpr
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: haya14busa/action-bumpr@v1

      # Update corresponding major and minor tag.
      # e.g. Update v1 and v1.2 when releasing v1.2.3
      #
      # Guarded on next_version rather than "!skip": on a tag push the bumpr
      # step above is skipped entirely, so `skip` is empty -- and "!<empty>" is
      # truthy, which would run this step with an empty tag input.
      - uses: haya14busa/action-update-semver@v1
        if: steps.bumpr.outputs.next_version != ''
        with:
          tag: ${{ steps.bumpr.outputs.next_version }}

      # Get tag name. ref_name, not ref: github.ref is "refs/tags/v1.2.3", so
      # using it would tag and name the release after the whole ref.
      - id: tag
        uses: haya14busa/action-cond@v1
        with:
          cond: "${{ startsWith(github.ref, 'refs/tags/') }}"
          if_true: ${{ github.ref_name }}
          if_false: ${{ steps.bumpr.outputs.next_version }}

      # Create release. actions/create-release was archived in 2021 and still
      # declares `using: node12`, so it is replaced with a maintained action.
      - uses: softprops/action-gh-release@v2
        if: "steps.tag.outputs.value != ''"
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body: ${{ steps.bumpr.outputs.message }}
          draft: false
          prerelease: false

  release-check:
    if: github.event.action == 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post bumpr status comment
        uses: haya14busa/action-bumpr@v1
